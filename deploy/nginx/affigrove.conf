limit_req_zone $binary_remote_addr zone=affigrove_enquiries:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name affigrove.io www.affigrove.io os.affigrove.io;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.affigrove.io;
    ssl_certificate /etc/letsencrypt/live/affigrove.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affigrove.io/privkey.pem;
    return 301 https://affigrove.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name affigrove.io;
    ssl_certificate /etc/letsencrypt/live/affigrove.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affigrove.io/privkey.pem;

    # Remove these two lines only after the public launch is approved.
    auth_basic "AffiGrove review";
    auth_basic_user_file /etc/affigrove/review.htpasswd;

    location /api/public/enquiries {
        limit_req zone=affigrove_enquiries burst=4 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name os.affigrove.io;
    ssl_certificate /etc/letsencrypt/live/affigrove.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/affigrove.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
